[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-compiler"
version = "0.1.0"
description = "Minimal numpy state-vector quantum circuit simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
qc-compiler = "qc_compiler.cli:main"

[tool.setuptools]
packages = ["qc_compiler"]
